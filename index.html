<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصد الهلال الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; text-align: center; padding: 20px; }
        .card { background: #1a1f2b; padding: 25px; border-radius: 20px; max-width: 420px; margin: auto; border: 1px solid #4361ee; }
        .status { color: #4caf50; font-size: 13px; margin-bottom: 15px; background: rgba(76, 175, 80, 0.1); padding: 5px; border-radius: 10px; }
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #242c3d; color: white; text-align: center; font-size: 18px; }
        button { background: #4361ee; color: white; border: none; padding: 15px; width: 85%; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px; }
        .result-box { margin-top: 25px; text-align: right; background: #242c3d; padding: 15px; border-radius: 15px; display: none; border-right: 5px solid #4cc9f0; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        #err-log { color: #ff4d4d; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #4cc9f0;">🌙 مرصد الهلال الذكي</h2>
        <div class="status">المحرك الفلكي متصل وجاهز ✅</div>
        
        <input type="number" id="lat" value="30.5" step="any">
        <input type="number" id="lon" value="47.8" step="any">
        
        <button onclick="safeCalculate()">احسب البيانات الآن</button>
        <div id="err-log"></div>

        <div id="results" class="result-box">
            <div class="row"><span>🌅 وقت الغروب:</span> <span id="v-sunset" style="color:#ffeb3b"></span></div>
            <div class="row"><span>🌑 ولادة الهلال:</span> <span id="v-newmoon"></span></div>
            <div class="row" style="color:#4cc9f0; font-weight:bold;"><span>⏳ عمر الهلال:</span> <span id="v-age"></span></div>
            <div class="row"><span>📐 الارتفاع:</span> <span id="v-alt"></span></div>
            <div class="row"><span>📏 البعد الزاوي:</span> <span id="v-elong"></span></div>
        </div>
    </div>

    <script>
        function safeCalculate() {
            const err = document.getElementById('err-log');
            const res = document.getElementById('results');
            err.style.display = 'none';
            
            try {
                const lat = parseFloat(document.getElementById('lat').value);
                const lon = parseFloat(document.getElementById('lon').value);
                const observer = new Astronomy.Observer(lat, lon, 0);
                
                // تحديد تاريخ اليوم بدقة
                let searchDate = new Date();
                searchDate.setHours(0,0,0,0); // نبدأ من مطلع اليوم

                // البحث عن الغروب
                const sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, 1, searchDate, 1);
                
                // أهم فحص لمنع خطأ 'date' من الظهور
                if (!sunset || !sunset.date) {
                    throw "المحرك لم يجد بيانات الغروب لهذا اليوم، يرجى المحاولة لاحقاً.";
                }

                const sunsetDate = sunset.date;
                const mq = Astronomy.SearchMoonQuarter(sunsetDate);
                const newMoonDate = mq.prev.date;

                const diff = sunsetDate.getTime() - newMoonDate.getTime();
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);

                const mEqu = Astronomy.Equator(Astronomy.Body.Moon, sunsetDate, observer);
                const mHor = Astronomy.Horizon(sunsetDate, observer, mEqu.ra, mEqu.dec, 'nora');
                const elong = Astronomy.Elongation(Astronomy.Body.Moon, sunsetDate);

                document.getElementById('v-sunset').innerText = sunsetDate.toLocaleTimeString('ar-EG');
                document.getElementById('v-newmoon').innerText = newMoonDate.toLocaleTimeString('ar-EG');
                document.getElementById('v-age').innerText = h + " ساعة و " + m + " دقيقة";
                document.getElementById('v-alt').innerText = mHor.alt.toFixed(2) + "°";
                document.getElementById('v-elong').innerText = elong.angsep.toFixed(2) + "°";

                res.style.display = 'block';
            } catch (e) {
                err.innerText = "حدث تنبيه: " + e;
                err.style.display = 'block';
                console.error(e);
            }
        }
    </script>
</body>
</html>
