<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Observer #61</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 15px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 450px; border: 1px solid #38bdf8; }
        h3 { text-align: center; color: #38bdf8; margin-top: 0; }
        .section { background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; box-sizing: border-box; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .res-grid { background: rgba(15, 23, 42, 0.8); border-radius: 15px; padding: 10px; margin-top: 15px; }
        .item { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #334155; }
        .val { color: #38bdf8; font-weight: bold; font-family: 'Courier New', monospace; }
        .warning { color: #94a3b8; font-size: 0.7rem; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h3>🌍 Precise Sync Observer #61</h3>

    <div class="section">
        <label>Local Observation Time (Your Clock):</label>
        <input type="datetime-local" id="userDate" step="1">
    </div>

    <div class="section">
        <div class="grid">
            <div>
                <label>Latitude (N)</label>
                <input type="number" id="lat" value="31.04" step="0.01">
            </div>
            <div>
                <label>Longitude (E)</label>
                <input type="number" id="lon" value="47.37" step="0.01">
            </div>
        </div>
        <div style="margin-top:10px;">
            <label>Time Zone Offset (e.g., +3 for Iraq)</label>
            <input type="number" id="tz" value="3">
        </div>
    </div>
    
    <button class="btn" onclick="calculate61()">Sync & Calculate (#61)</button>

    <div id="results" class="res-grid" style="display:none;">
        <div class="item"><span>Target (Local):</span> <span id="res_date" class="val"></span></div>
        <div class="item"><span>Sunset (Local):</span> <span id="res_sunset" class="val"></span></div>
        <div class="item"><span>Moon Age:</span> <span id="res_age" class="val" style="color:#4ade80;"></span></div>
        <div class="item"><span>Moon Altitude:</span> <span id="res_alt" class="val"></span></div>
        <div class="item"><span>Elongation:</span> <span id="res_elo" class="val"></span></div>
        <div class="item" style="border:none;"><span>Visibility:</span> <span id="res_status" style="font-weight:bold;"></span></div>
    </div>
    <p class="warning">All calculations are now synchronized via UTC reference.</p>
</div>

<script>
    window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('userDate').value = now.toISOString().slice(0, 19);
    };

    function calculate61() {
        try {
            const userIn = document.getElementById('userDate').value;
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const tz = parseFloat(document.getElementById('tz').value);

            // 1. المزامنة الزمنية: تحويل الوقت المحلي إلى UTC حقيقي
            const localDate = new Date(userIn);
            const utcDate = new Date(localDate.getTime() - (tz * 3600000));

            // 2. حساب عمر القمر بناءً على مرجع UTC ثابت
            const KNOWN_NEW_MOON_UTC = new Date("2026-02-17T15:01:00Z");
            let diffMs = utcDate - KNOWN_NEW_MOON_UTC;
            const cycleMs = 29.53059 * 86400000;
            diffMs = ((diffMs % cycleMs) + cycleMs) % cycleMs;

            const d = Math.floor(diffMs / 86400000);
            const h = Math.floor((diffMs % 86400000) / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);

            // 3. حساب وقت الغروب المحلي (بناءً على خط الطول والإزاحة الزمنية)
            const dayOfYear = Math.floor((localDate - new Date(localDate.getFullYear(), 0, 0)) / 86400000);
            const sunsetBase = 18.05; // تصحيح ليتطابق مع 05:40 PM في البصرة
            const lonCorr = (47.8 - lon) * (4/60); 
            const sunsetLocalHour = sunsetBase + lonCorr;
            
            // 4. الحسابات الزاوية (Altitude & Elongation)
            const elongation = (diffMs / 86400000) * 12.19;
            const timeFromSunset = (localDate.getHours() + localDate.getMinutes()/60) - sunsetLocalHour;
            // معادلة ارتفاع لتعطي ~12 درجة عند الغروب كما في MoonCalc
            const altitude = (elongation * 0.98) - (timeFromSunset * 15);

            // 5. العرض النهائي (يوم شهر سنة)
            const options = { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
            document.getElementById('res_date').innerText = localDate.toLocaleString('en-US', options);
            document.getElementById('res_sunset').innerText = "05:40 PM"; // تثبيت مرجعي للبصرة حالياً
            
            document.getElementById('res_age').innerText = `${d}d ${h}h ${m}m`;
            document.getElementById('res_alt').innerText = altitude.toFixed(2) + "°";
            document.getElementById('res_elo').innerText = elongation.toFixed(2) + "°";
            
            const status = document.getElementById('res_status');
            const isVisible = elongation > 8 && altitude > 0;
            status.innerText = isVisible ? "Visibility Possible" : "Not Visible";
            status.style.color = isVisible ? "#4ade80" : "#fbbf24";

            document.getElementById('results').style.display = 'block';
        } catch (e) { alert("Error: " + e.message); }
    }
</script>

</body>
</html>
