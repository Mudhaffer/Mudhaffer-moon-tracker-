<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فحص محرك الهلال</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #121212; color: #00ff00; font-family: monospace; padding: 20px; }
        .log-box { border: 1px solid #333; padding: 10px; background: #000; height: 300px; overflow-y: auto; text-align: left; dir: ltr; }
        button { padding: 15px; background: #4361ee; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 18px; }
    </style>
</head>
<body>
    <h2>نظام فحص الأخطاء الفلكي</h2>
    <button onclick="debugCalculate()">بدء الفحص العميق</button>
    <p>مخرجات النظام (Console Log):</p>
    <div id="log" class="log-box"></div>

    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += "> " + msg + "<br>";
        }

        function debugCalculate() {
            log("بدء العملية...");
            try {
                if (typeof Astronomy === 'undefined') {
                    log("خطأ: المكتبة لم تُحمل بعد!");
                    return;
                }
                log("المكتبة الفلكية جاهزة ✅");

                const observer = new Astronomy.Observer(30.5, 47.8, 0);
                log("تم تحديد موقع البصرة (30.5, 47.8)");

                const targetDate = new Date();
                log("التاريخ المستخدم للبحث: " + targetDate.toString());

                // محاولة حساب الغروب بطريقة مختلفة لضمان النتيجة
                const sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, 1, targetDate, 1);
                
                if (sunset) {
                    log("تم العثور على الغروب بنجاح! الوقت: " + sunset.date);
                    // هنا تكمن المشكلة إذا كان sunset موجوداً ولكن date مفقودة
                    if (sunset.date) {
                        log("التاريخ (date) موجود داخل الكائن ✅");
                        alert("نجح الفحص! الغروب عند الساعة: " + sunset.date.toLocaleTimeString());
                    } else {
                        log("فشل: كائن الغروب موجود ولكن خاصية date مفقودة!");
                    }
                } else {
                    log("فشل: لم يتم العثور على أي وقت للغروب (Returned null)");
                }

            } catch (e) {
                log("خطأ برمجي حرج: " + e.message);
                console.error(e);
            }
        }
    </script>
</body>
</html>
