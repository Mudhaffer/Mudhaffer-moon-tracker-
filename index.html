<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الهلال الاحترافية</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0e14; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1a1f2b; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; border: 1px solid #2d3446; }
        h2 { color: #4cc9f0; margin-bottom: 10px; }
        button { background: #4361ee; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-size: 16px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:active { transform: scale(0.98); background: #3a0ca3; }
        .result-box { margin-top: 20px; text-align: right; background: #242c3d; padding: 15px; border-radius: 10px; display: none; }
        .data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
        .label { color: #94a3b8; }
        .value { color: #f8fafc; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>مرصد الهلال الذكي</h2>
    <p id="status" style="font-size: 14px; color: #888;">اضغط للحصول على البيانات من موقعك الحالي</p>
    <button onclick="getMoonData()">حساب بيانات الهلال</button>

    <div id="results" class="result-box">
        <div class="data-row"><span class="label">وقت الغروب:</span> <span id="v-sunset" class="value"></span></div>
        <div class="data-row"><span class="label">تولد القمر:</span> <span id="v-newmoon" class="value"></span></div>
        <div class="data-row" style="background: #2d3748; padding: 10px; border-radius: 5px;"><span class="label">عمر القمر:</span> <span id="v-age" class="value" style="color: #4cc9f0;"></span></div>
        <div class="data-row"><span class="label">الارتفاع عن الأفق:</span> <span id="v-alt" class="value"></span></div>
        <div class="data-row"><span class="label">البعد الزاوي:</span> <span id="v-elong" class="value"></span></div>
        <div class="data-row"><span class="label">نسبة الإضاءة:</span> <span id="v-illum" class="value"></span></div>
    </div>
</div>

<script>
function getMoonData() {
    document.getElementById('status').innerText = "جاري تحديد الموقع وحساب البيانات...";
    
    navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const observer = new Astronomy.Observer(lat, lon, 0);
        const now = new Date();

        // 1. حساب وقت غروب الشمس اليوم
        const sunsetSearch = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, Astronomy.Direction.Set, now);
        const sunsetDate = sunsetSearch.date;

        // 2. حساب لحظة الاقتران (تولد القمر) السابقة للغروب
        const prevNewMoon = Astronomy.SearchMoonQuarter(sunsetDate).prev; 
        // ملاحظة: SearchMoonQuarter يعيد أقرب أطوار القمر (محاق، تربيع، بدر)

        // 3. حساب عمر القمر (الفرق بين الغروب والاقتران)
        const diffMs = sunsetDate.getTime() - prevNewMoon.date.getTime();
        const hours = Math.floor(diffMs / (1000 * 60 * 60));
        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        // 4. حساب الارتفاع والبعد الزاوي لحظة الغروب
        const moonEquator = Astronomy.Equator(Astronomy.Body.Moon, sunsetDate, observer);
        const moonHoriz = Astronomy.Horizon(sunsetDate, observer, moonEquator.ra, moonEquator.dec, 'nora');
        const elongation = Astronomy.Elongation(Astronomy.Body.Moon, sunsetDate);
        const illum = Astronomy.Illumination(Astronomy.Body.Moon, sunsetDate);

        // تحديث الواجهة
        document.getElementById('results').style.display = 'block';
        document.getElementById('status').innerText = "تم تحديث البيانات بنجاح";
        document.getElementById('v-sunset').innerText = sunsetDate.toLocaleTimeString('ar-EG');
        document.getElementById('v-newmoon').innerText = prevNewMoon.date.toLocaleTimeString('ar-EG');
        document.getElementById('v-age').innerText = `${hours} ساعة و ${minutes} دقيقة`;
        document.getElementById('v-alt').innerText = moonHoriz.alt.toFixed(2) + "°";
        document.getElementById('v-elong').innerText = elongation.angsep.toFixed(2) + "°";
        document.getElementById('v-illum').innerText = (illum.phase_angle / 1.8).toFixed(2) + "%";

    }, error => {
        document.getElementById('status').innerText = "خطأ: تأكد من تفعيل الـ GPS";
    });
}
</script>

</body>
</html>
