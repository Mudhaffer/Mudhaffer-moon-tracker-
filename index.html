<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام حساب رؤية الهلال</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; width: 100%; max-width: 750px; border: 2px solid #38bdf8; }
        .grid-row, .location-row, .input-group { display: grid; gap: 12px; margin-bottom: 15px; }
        .grid-row { grid-template-columns: 1fr 1fr 120px; }
        .location-row { grid-template-columns: 1fr 1fr 1fr 120px; }
        .input-group { grid-template-columns: 1fr 1fr 120px; }
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; text-align: center; }
        .btn { border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #38bdf8; color: #0f172a; }
        .btn-green { background: #22c55e; color: white; }
        #results-area { border: 1px solid #334155; padding: 20px; border-radius: 8px; background: #111827; margin-top: 20px; min-height: 100px; }
        .result-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center">🌙 نظام حساب رؤية الهلال</h2>
    
    <div class="grid-row">
        <input type="text" id="dateInput" onchange="calculate()">
        <input type="text" id="timeInput" onchange="calculate()">
        <button class="btn btn-green" onclick="setNow()">الآن 🕒</button>
    </div>
    <div class="location-row">
        <select id="citySelect" onchange="updateCoords()">
            <option value="">اختر المدينة</option>
            <option value="basra">البصرة</option>
            <option value="baghdad">بغداد</option>
            <option value="najaf">النجف</option>
        </select>
        <input type="text" id="lat" placeholder="خط العرض" onchange="calculate()">
        <input type="text" id="lon" placeholder="خط الطول" onchange="calculate()">
        <button class="btn btn-blue" onclick="getLocation()">تلقائي 📍</button>
    </div>

    <div class="input-group">
        <input type="text" id="conjDisplay" placeholder="الاقتران" readonly>
        <input type="text" id="sunsetDisplay" placeholder="الغروب" readonly>
        <button class="btn btn-blue" onclick="calculate()">حساب 🧮</button>
    </div>

    <div id="results-area"></div>
</div>

<script>
    // --- بداية مرحلة التهيئة ---
    window.onload = () => {
        flatpickr("#dateInput", { dateFormat: "m/d/Y" });
        flatpickr("#timeInput", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
        
        const now = new Date();
        document.getElementById('dateInput').value = now.toLocaleDateString();
        document.getElementById('timeInput').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        
        getLocation();
    };

    function setNow() {
        const now = new Date();
        document.getElementById('dateInput').value = now.toLocaleDateString();
        document.getElementById('timeInput').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        calculate();
    }
    // --- نهاية مرحلة التهيئة ---

    // --- بداية مرحلة الموقع الجغرافي ---
    function updateCoords() {
        const city = document.getElementById('citySelect').value;
        const coords = { "basra": ["30.5081", "47.7835"], "baghdad": ["33.3152", "44.3661"], "najaf": ["32.0259", "44.3463"] };
        if(coords[city]) {
            document.getElementById('lat').value = coords[city][0];
            document.getElementById('lon').value = coords[city][1];
            calculate(); 
        }
    }

    function getLocation() {
        navigator.geolocation.getCurrentPosition(p => {
            document.getElementById('lat').value = p.coords.latitude.toFixed(4);
            document.getElementById('lon').value = p.coords.longitude.toFixed(4);
            calculate();
        }, () => { console.log("الموقع غير متاح"); });
    }
    // --- نهاية مرحلة الموقع الجغرافي ---

    // --- بداية مرحلة الحسابات الفلكية (المسار الأول) ---
    function getTrueConjunction(dateObj) {
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth() + 1;
        const day = dateObj.getDate();
        
        // حساب الرقم k (عدد الشهور القمرية منذ عام 2000)
        const k = Math.floor((year + (month - 1) / 12 - 2000) * 12.3685);
        const T = k / 1236.85;
        
        // التوقيت المتوسط للاقتران (بصيغة اليوم الجولياني)
        let JDE = 2451550.09765 + 29.530588853 * k 
                 + 0.0001337 * T * T 
                 - 0.000000150 * T * T * T;
        
        // تصحيحات شمسية وقمرية بسيطة (الشذوذ المتوسط)
        const M = (2.5534 + 29.1053567 * k) * Math.PI / 180; // الشمس
        const Mprime = (201.5643 + 385.816935 * k) * Math.PI / 180; // القمر
        
        JDE += (0.1734 - 0.000393 * T) * Math.sin(M) 
               - 0.4068 * Math.sin(Mprime);

        // تحويل اليوم الجولياني إلى تاريخ ميلادي ووقت محلي (العراق +3)
        const date = new Date((JDE - 2440587.5) * 86400000);
        return date;
    }

    function calculate() {
        const lat = document.getElementById('lat').value;
        const lon = document.getElementById('lon').value;
        const dateInput = document.getElementById('dateInput').value;
        
        if(!lat || !lon || !dateInput) return;

        const dateObj = new Date(dateInput);
        const conjDate = getTrueConjunction(dateObj);
        
        // عرض النتيجة بصيغة (يوم/شهر ساعة:دقيقة)
        const conjStr = conjDate.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        const conjFullDate = conjDate.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' });

        document.getElementById('conjDisplay').value = conjStr;
        document.getElementById('sunsetDisplay').value = "18:05";
        
        document.getElementById('results-area').innerHTML = `
            <div class="result-item"><span>تاريخ الاقتران:</span> <span>${conjFullDate}</span></div>
            <div class="result-item"><span>وقت الاقتران المحلي:</span> <span>${conjStr}</span></div>
            <div class="result-item"><span>عمر الهلال النسبي:</span> <span>${Math.floor((new Date() - conjDate)/3600000)} ساعة</span></div>
        `;
    }
    // --- نهاية مرحلة الحسابات الفلكية ---
</script>
</body>
</html>
