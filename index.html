<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال الاحترافية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; width: 100%; max-width: 700px; border: 2px solid #38bdf8; }
        h2 { text-align: center; margin-bottom: 25px; font-size: 1.5em; }
        
        /* تنسيق الشبكة لترتيب العناصر */
        .grid-row { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 12px; margin-bottom: 15px; align-items: center; }
        .location-row { display: grid; grid-template-columns: 1fr 1fr 1.5fr 120px; gap: 12px; margin-bottom: 15px; }
        .result-row { display: grid; grid-template-columns: 1.5fr 1.5fr 1.5fr 120px; gap: 12px; margin-bottom: 15px; }

        input, select { padding: 12px; border-radius: 6px; border: 1px solid #38bdf8; background: #0f172a; color: #38bdf8; text-align: center; width: 100%; box-sizing: border-box; }
        
        /* تلوين أيقونة التقويم */
        input::-webkit-calendar-picker-indicator { filter: invert(0.7) sepia(1) saturate(5) hue-rotate(175deg); cursor: pointer; }

        /* توحيد أزرار التحكم على جهة اليسار */
        .btn { border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-blue { background: #38bdf8; color: #0f172a; }
        .btn-green { background: #22c55e; color: white; }
        .btn-blue:hover { background: #7dd3fc; }

        #results-area { border: 1px solid #334155; padding: 15px; border-radius: 6px; background: #111827; min-height: 60px; text-align: center; color: #94a3b8; }
    </style>
</head>
<body onload="initialize()">

<div class="card">
    <h2>🌙 نظام حساب رؤية الهلال</h2>
    
    <div class="grid-row">
        <input type="text" id="dateInput" placeholder="التاريخ">
        <input type="text" id="timeInput" placeholder="الوقت">
        <button class="btn btn-green" onclick="setNow()">الآن 🕒</button>
    </div>

    <div class="location-row">
        <input type="text" id="lon" placeholder="خط الطول">
        <input type="text" id="lat" placeholder="خط العرض">
        <select id="citySelect" onchange="updateCoords()">
            <option value="">اختر مدينة...</option>
            <option value="basra">البصرة</option>
            <option value="baghdad">بغداد</option>
            <option value="najaf">النجف</option>
            <option value="current" id="currentOption" style="display:none;">موقعي الحالي 📍</option>
        </select>
        <button class="btn btn-blue" onclick="getLocation()">تلقائي 📍</button>
    </div>

    <div class="result-row">
        <input type="text" id="sunsetTime" placeholder="وقت الغروب" readonly>
        <input type="text" id="conjunction" placeholder="موعد الاقتران" readonly>
        <input type="text" id="moonData" placeholder="بيانات الهلال" readonly>
        <button class="btn btn-blue" onclick="calculate()">حساب 🧮</button>
    </div>

    <div id="results-area">النتائج ستظهر هنا بعد الحساب...</div>
</div>

<script>
    let datePicker, timePicker;

    function initialize() {
        // تهيئة التقويم والوقت
        datePicker = flatpickr("#dateInput", { dateFormat: "F / Y / d" });
        timePicker = flatpickr("#timeInput", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
        
        // التشغيل التلقائي عند فتح الصفحة
        setNow();
    }

    function setNow() {
        const now = new Date();
        datePicker.setDate(now);
        timePicker.setDate(now);
    }

    function updateCoords() {
        const city = document.getElementById('citySelect').value;
        const coords = {
            "basra": { lat: "30.5081", lon: "47.7835" },
            "baghdad": { lat: "33.3152", lon: "44.3661" },
            "najaf": { lat: "32.0259", lon: "44.3463" }
        };
        if(coords[city]) {
            document.getElementById('lat').value = coords[city].lat;
            document.getElementById('lon').value = coords[city].lon;
        }
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                document.getElementById('lat').value = position.coords.latitude.toFixed(4);
                document.getElementById('lon').value = position.coords.longitude.toFixed(4);
                
                // تحديث اسم المحافظة ليكون احترافياً
                const citySelect = document.getElementById('citySelect');
                const currentOpt = document.getElementById('currentOption');
                currentOpt.style.display = "block";
                citySelect.value = "current";
            });
        }
    }

   // --- الجزء الخاص بالمعادلات الفلكية داخل وسم <script> ---

function calculate() {
    const selectedDate = datePicker.selectedDates[0];
    const lat = parseFloat(document.getElementById('lat').value);
    const lon = parseFloat(document.getElementById('lon').value);

    if (!selectedDate || isNaN(lat) || isNaN(lon)) {
        alert("يرجى التأكد من اختيار التاريخ والإحداثيات");
        return;
    }

    // 1. حساب موعد الغروب (تقريبي بناءً على الموقع والتاريخ)
    const sunset = calculateSunset(selectedDate, lat, lon);
    document.getElementById('sunsetTime').value = sunset;

    // 2. حساب موعد الاقتران المركزي (New Moon)
    const conjunctionDate = calculateNextConjunction(selectedDate);
    const options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    document.getElementById('conjunction').value = conjunctionDate.toLocaleString('en-US', options);

    document.getElementById('results-area').innerHTML = "تم تحديث الحسابات بناءً على خوارزميات Meeus الفلكية.";
}

// دالة مبسطة لحساب الاقتران المركزي القادم
// --- تحديث المعادلات الفلكية الدقيقة ---

function calculate() {
    const selectedDate = datePicker.selectedDates[0];
    const lat = parseFloat(document.getElementById('lat').value);
    const lon = parseFloat(document.getElementById('lon').value);

    if (!selectedDate || isNaN(lat) || isNaN(lon)) return;

    // 1. حساب الغروب بدقة ستيلاريوم (مع تصحيح الانكسار)
    const sunsetStr = calculateSunsetStellarium(selectedDate, lat, lon);
    document.getElementById('sunsetTime').value = "غروب الشمس: " + sunsetStr;

    // 2. حساب الاقتران المركزي (بدقة عالية)
    const conjDate = getHighPrecisionConjunction(selectedDate);
    const conjOptions = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    document.getElementById('conjunction').value = "الاقتران: " + conjDate.toLocaleString('en-US', conjOptions);

    // 3. حساب عمر الهلال: الفارق بين وقت الغروب (في اليوم المختار) ووقت الاقتران
    const [sH, sM] = sunsetStr.split(':').map(Number);
    const sunsetMoment = new Date(selectedDate);
    sunsetMoment.setHours(sH, sM, 0);

    const diffMs = sunsetMoment - conjDate;
    
    // التعديل: عمر الهلال هو الفرق بين الغروب والاقتران
    const hours = Math.floor(diffMs / 3600000);
    const mins = Math.floor((diffMs % 3600000) / 60000);
    
    document.getElementById('moonData').value = diffMs > 0 
        ? `عمر الهلال: ${hours}س ${mins}د` 
        : "عمر الهلال: لم يولد بعد";

    document.getElementById('results-area').innerHTML = "تمت المزامنة مع بيانات الغروب الفلكية.";
}

// دالة غروب الشمس المطابقة لستيلاريوم
function calculateSunsetStellarium(date, lat, lon) {
    const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
    const phi = lat * Math.PI / 180;
    // معادلة ميل الشمس
    const delta = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI / 365 * (dayOfYear + 10));
    
    // زاوية الغروب مع تصحيح انكسار -0.833 (ستيلاريوم يعتمد هذا المعيار)
    const cosH = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(phi) * Math.sin(delta)) / (Math.cos(phi) * Math.cos(delta));
    const H = Math.acos(Math.max(-1, Math.min(1, cosH))) * 180 / Math.PI;
    
    // حساب التوقيت الشمسي المحلي
    const utcNoon = 12 - lon / 15;
    const sunsetUtc = utcNoon + H / 15;
    
    // إضافة 3 ساعات لتوقيت العراق + تصحيح الفرق الذي لاحظته
    let localTime = (sunsetUtc + 3);
    const hours = Math.floor(localTime);
    const mins = Math.round((localTime - hours) * 60);
    
    return hours.toString().padStart(2, '0') + ":" + mins.toString().padStart(2, '0');
}
</script>
</body>
</html>
