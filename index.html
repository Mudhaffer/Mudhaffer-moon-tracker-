<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; width: 100%; max-width: 600px; border: 2px solid #38bdf8; }
        h2 { text-align: center; color: #f1f5f9; }
        label { font-size: 0.9em; margin-bottom: 5px; display: block; }
        input, select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; box-sizing: border-box; }
        .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .row-calc { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn-loc { background: #e11d48; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
        .btn-calc { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 بيانات رؤية الهلال</h2>
    
    <label>التاريخ والوقت:</label>
    <input type="date" id="dateInput"> <div class="row">
        <button class="btn-loc" onclick="getLocation()">موقع تلقائي</button>
        <select id="citySelect"><option>البصرة</option></select>
        <input type="text" id="lat" placeholder="Lat">
        <input type="text" id="lon" placeholder="Lon">
    </div>

    <div class="row-calc">
        <input type="text" id="conjunction" placeholder="موعد الاقتران القادم" disabled>
        <input type="text" id="moonData" placeholder="بيانات الهلال بعد الغروب" disabled>
        <button class="btn-calc" onclick="calculate()">إظهار النتيجة</button>
    </div>

    <div id="results" style="border: 1px solid #334155; padding: 15px; border-radius: 5px;">
        النتائج ستظهر هنا...
    </div>
</div>
</body>
</html>
