<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المرصد الفلكي الموثوق</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1f2b; padding: 25px; border-radius: 20px; max-width: 400px; margin: auto; border: 1px solid #4361ee; }
        .row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; }
        .val { color: #4cc9f0; font-weight: bold; }
        #log { color: #ffbe0b; font-size: 13px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌙 بيانات الهلال المباشرة</h2>
        <div id="log">جاري الاتصال بالمحرك...</div>
        
        <div id="res" style="display:none">
            <div class="row"><span>🌅 وقت الغروب:</span> <span id="v1" class="val"></span></div>
            <div class="row"><span>🌑 ولادة الهلال:</span> <span id="v2" class="val"></span></div>
            <div class="row" style="background:rgba(76,201,240,0.1)"><span>⏳ عمر الهلال:</span> <span id="v3" class="val"></span></div>
            <div class="row"><span>📐 الارتفاع:</span> <span id="v4" class="val"></span></div>
            <div class="row"><span>📏 البعد الزاوي:</span> <span id="v5" class="val"></span></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                try {
                    const obs = new Astronomy.Observer(30.5, 47.8, 0);
                    let now = new Date();
                    
                    // البحث عن الغروب
                    let sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, obs, 1, now, 1);
                    
                    // إذا فشل المتصفح، سنعطيه وقت غروب تقديري لليوم لمنع الانهيار
                    let finalDate;
                    if (sunset && sunset.date) {
                        finalDate = sunset.date;
                        document.getElementById('log').innerText = "تم الحساب آلياً ✅";
                    } else {
                        finalDate = new Date();
                        finalDate.setHours(18, 30, 0); // وقت افتراضي 6:30 مساءً
                        document.getElementById('log').innerText = "تم استخدام وقت تقديري (نمط الاحتياط) ⚠️";
                    }

                    const mq = Astronomy.SearchMoonQuarter(finalDate);
                    const nm = mq.prev.date;
                    const diff = finalDate - nm;
                    const h = Math.floor(diff/3600000);
                    const m = Math.floor((diff%3600000)/60000);

                    const equ = Astronomy.Equator(Astronomy.Body.Moon, finalDate, obs);
                    const hor = Astronomy.Horizon(finalDate, obs, equ.ra, equ.dec, 'nora');
                    const elo = Astronomy.Elongation(Astronomy.Body.Moon, finalDate);

                    document.getElementById('v1').innerText = finalDate.toLocaleTimeString('ar-EG');
                    document.getElementById('v2').innerText = nm.toLocaleTimeString('ar-EG');
                    document.getElementById('v3').innerText = h + " ساعة و " + m + " دقيقة";
                    document.getElementById('v4').innerText = hor.alt.toFixed(2) + "°";
                    document.getElementById('v5').innerText = elo.angsep.toFixed(2) + "°";

                    document.getElementById('res').style.display = 'block';
                } catch (e) {
                    document.getElementById('log').innerText = "خطأ حرج: " + e.message;
                }
            }, 1500);
        };
    </script>
</body>
</html>
