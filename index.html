<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحرك المرجعي #49</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; padding: 15px; text-align: center; }
        .box { background: #1a1f2b; border: 2px solid #22d3ee; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; }
        .val { color: #22d3ee; font-weight: bold; font-family: monospace; display: block; margin-bottom: 10px; font-size: 1.2em; }
        .label { color: #94a3b8; font-size: 0.9em; }
        button { background: #22d3ee; color: #0b0e14; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h3>🌙 مرصد الهلال - محاولة #49</h3>
    <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
    
    <span class="label">وقت الولادة (UTC):</span>
    <span id="res1" class="val">بانتظار التشغيل...</span>

    <span class="label">عمر الهلال الحالي:</span>
    <span id="res2" class="val">--</span>

    <span class="label">الارتفاع الزاوي:</span>
    <span id="res3" class="val">--</span>

    <button onclick="start49()">حساب البيانات الآن (#49)</button>
    <div id="debug" style="font-size: 10px; color: #444; margin-top: 10px;"></div>
</div>

<script>
    function start49() {
        const debug = document.getElementById('debug');
        try {
            // استخدام الوقت الحالي للنظام مباشرة لتفادي خطأ undefined
            const now = new Date();
            const obs = new Astronomy.Observer(30.5, 47.8, 0);

            // حساب المحاق بطريقة المحرك العالمي
            let mq = Astronomy.SearchMoonQuarter(now);
            if (mq.quarter !== 0 || mq.date > now) {
                mq = Astronomy.SearchMoonQuarter(new Date(mq.date.getTime() - 15 * 86400000));
            }

            // الحسابات الفلكية الأساسية
            const equ = Astronomy.Equator(Astronomy.Body.Moon, now, obs, true, true);
            const hor = Astronomy.Horizon(now, obs, equ.ra, equ.dec, 'none');

            // حساب العمر بالساعات والدقائق
            const diff = now.getTime() - mq.date.getTime();
            const hrs = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);

            // عرض النتائج مع فحص الأمان لكل قيمة
            document.getElementById('res1').innerText = mq.date ? mq.date.toISOString() : "N/A";
            document.getElementById('res2').innerText = hrs + " ساعة و " + mins + " دقيقة";
            document.getElementById('res3').innerText = (hor && hor.alt) ? hor.alt.toFixed(2) + "°" : "0.00°";

            debug.innerText = "تم التحديث بنجاح: " + now.toLocaleTimeString();

        } catch (e) {
            alert("خطأ في المحاولة 49: " + e.message);
            debug.innerText = "Error: " + e.message;
        }
    }
    
    // محاولة التشغيل الذاتي عند التحميل
    window.onload = start49;
</script>

</body>
</html>
