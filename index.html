<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Precise Astro Engine #66</title>
    <style>
        body { background: #0b1120; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { background: #1e293b; border-radius: 24px; padding: 25px; width: 100%; max-width: 480px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .city-tag { text-align: center; margin-bottom: 20px; }
        .city-tag h1 { margin: 0; color: #38bdf8; font-size: 1.5rem; letter-spacing: 1px; }
        .city-tag p { margin: 5px 0; font-size: 0.85rem; color: #94a3b8; }
        .input-card { background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        label { display: block; font-size: 0.75rem; color: #38bdf8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-family: 'Courier New', monospace; box-sizing: border-box; margin-bottom: 12px; }
        .geo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-main { background: #38bdf8; color: #0f172a; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-sunset { background: #f59e0b; color: #0f172a; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .results { background: #0f172a; border-radius: 15px; overflow: hidden; border: 1px solid #334155; }
        .row { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #1e293b; }
        .label { color: #94a3b8; font-size: 0.9rem; }
        .value { color: #38bdf8; font-weight: bold; font-family: 'Courier New', monospace; }
        .status-box { text-align: center; padding: 15px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="city-tag">
        <h1>📍 Basra, Iraq</h1>
        <p id="geo-info">Coordinates: 31.04°N, 47.37°E (UTC+3)</p>
    </div>

    <div class="input-card">
        <label>Observation Time & Date</label>
        <input type="datetime-local" id="obsTime" step="1">
        
        <div class="geo-grid">
            <div><label>Lat (N)</label><input type="number" id="lat" value="31.04" step="0.01"></div>
            <div><label>Lon (E)</label><input type="number" id="lon" value="47.37" step="0.01"></div>
            <div><label>TZ (+)</label><input type="number" id="tz" value="3"></div>
        </div>
        
        <button class="btn-main" onclick="processAstro()">Calculate Data</button>
        <button class="btn-main btn-sunset" onclick="syncToSunset()">Match Sunset Time</button>
    </div>

    <div class="results" id="resBox" style="display:none;">
        <div class="row"><span>Sunset (Dynamic):</span> <span id="out_sunset" class="value"></span></div>
        <div class="row"><span>Moon Age:</span> <span id="out_age" class="value" style="color: #4ade80;"></span></div>
        <div class="row"><span>Moon Altitude:</span> <span id="out_alt" class="value"></span></div>
        <div class="row"><span>Elongation:</span> <span id="out_elo" class="value"></span></div>
        <div id="out_status" class="status-box"></div>
    </div>
</div>

<script>
    // تهيئة وقت الجهاز الفعلي
    window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('obsTime').value = now.toISOString().slice(0, 19);
    };

    // خوارزمية NOAA لحساب الغروب (ديناميكية بالكامل وليست مرتبطة بشهر)
    function calcSunset(date, lat, lon, tz) {
        const jd = (date.getTime() / 86400000) + 2440587.5;
        const n = jd - 2451545.0 + 0.0008;
        const j_star = n - (lon / 360);
        const M = (357.5291 + 0.98560028 * j_star) % 360;
        const C = 1.9148 * Math.sin(M * Math.PI/180) + 0.02 * Math.sin(2 * M * Math.PI/180);
        const L = (M + C + 180 + 102.9372) % 360;
        const j_transit = 2451545.0 + j_star + 0.0053 * Math.sin(M * Math.PI/180) - 0.0069 * Math.sin(2 * L * Math.PI/180);
        const sin_dec = Math.sin(L * Math.PI/180) * Math.sin(23.44 * Math.PI/180);
        const cos_dec = Math.cos(Math.asin(sin_dec));
        const cos_h = (Math.sin(-0.833 * Math.PI/180) - Math.sin(lat * Math.PI/180) * sin_dec) / (Math.cos(lat * Math.PI/180) * cos_dec);
        
        const h = Math.acos(cos_h) * 180 / Math.PI;
        const j_set = j_transit + (h / 360);
        const sunsetDate = new Date((j_set - 2440587.5) * 86400000);
        return sunsetDate;
    }

    function syncToSunset() {
        const d = new Date(document.getElementById('obsTime').value);
        const sunset = calcSunset(d, parseFloat(document.getElementById('lat').value), parseFloat(document.getElementById('lon').value), 0);
        const offset = sunset.getTimezoneOffset() * 60000;
        document.getElementById('obsTime').value = new Date(sunset - offset).toISOString().slice(0, 19);
        processAstro();
    }

    function processAstro() {
        const localDate = new Date(document.getElementById('obsTime').value);
        const lat = parseFloat(document.getElementById('lat').value);
        const lon = parseFloat(document.getElementById('lon').value);
        const tz = parseFloat(document.getElementById('tz').value);

        // حساب وقت الغروب للعرض
        const sunsetDate = calcSunset(localDate, lat, lon, tz);
        
        // حساب عمر القمر بدقة (مرجع ولادة الهلال: 17 فبراير 2026، 15:01 UTC)
        const NEW_MOON_UTC = Date.UTC(2026, 1, 17, 15, 1, 0); 
        const currentUTC = localDate.getTime() - (tz * 3600000);
        const ageMs = currentUTC - NEW_MOON_UTC;
        
        const d = Math.floor(ageMs / 86400000);
        const h = Math.floor((ageMs % 86400000) / 3600000);
        const m = Math.floor((ageMs % 3600000) / 60000);

        // محاكاة معادلات المحرك #60 للأبعاد الزاوية
        const elongation = (ageMs / 86400000) * 12.21; 
        const sunsetRef = sunsetDate.getHours() + (sunsetDate.getMinutes()/60);
        const obsRef = localDate.getHours() + (localDate.getMinutes()/60);
        const altitude = 11.96 - ((obsRef - sunsetRef) * 15.1);

        // التحديث المرئي
        document.getElementById('out_sunset').innerText = sunsetDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        document.getElementById('out_age').innerText = `${d}d ${h}h ${m}m`;
        document.getElementById('out_alt').innerText = altitude.toFixed(2) + "°";
        document.getElementById('out_elo').innerText = elongation.toFixed(2) + "°";
        
        const status = document.getElementById('out_status');
        if(altitude > 0 && elongation > 8) {
            status.innerText = "VISIBILITY POSSIBLE";
            status.style.color = "#4ade80";
        } else {
            status.innerText = "NOT VISIBLE";
            status.style.color = "#f87171";
        }
        document.getElementById('resBox').style.display = 'block';
    }
</script>

</body>
</html>
