<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        /* الألوان والهيكل كما في الصورة الأصلية */
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 15px; padding: 20px; width: 100%; max-width: 500px; border: 1px solid #38bdf8; }
        h2 { text-align: center; color: #f1f5f9; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; margin-bottom: 15px; box-sizing: border-box; }
        .btn-loc { background: #2ecc71; color: #0f172a; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-calc { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        #results { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 5px; min-height: 100px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 بيانات رؤية الهلال</h2>
    
    <label>التاريخ والوقت:</label>
    <input type="datetime-local" id="dateInput">
    
    <button class="btn-loc" onclick="alert('تحديد الموقع')">موقعي 📍</button>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" id="lon" placeholder="خط الطول">
        <input type="text" id="lat" placeholder="خط العرض">
    </div>

    <button class="btn-calc" onclick="calculate()">عرض النتائج</button>

    <div id="results">
        النتائج ستظهر هنا مع المقارنة اللونية...
    </div>
</div>

<script>
    function calculate() {
        // سيتم إضافة المنطق الفلكي هنا
        document.getElementById('results').innerHTML = "جاري الحساب...";
    }
</script>
</body>
</html>
