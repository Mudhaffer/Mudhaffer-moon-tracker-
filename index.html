<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مرصد الهلال - التحديث التلقائي</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #111827; padding: 30px; border-radius: 25px; max-width: 450px; margin: auto; border: 1px solid #3b82f6; }
        .data-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #1f2937; }
        .status-msg { font-size: 14px; padding: 10px; border-radius: 10px; margin-bottom: 20px; }
        .loading { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .value { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌙 مرصد الهلال الذكي</h2>
        <div id="status" class="status-msg loading">جاري محاولة الاتصال بالمحرك الفلكي...</div>
        
        <div id="results" style="display:none">
            <div class="data-row"><span>🌅 وقت الغروب:</span> <span id="r1" class="value"></span></div>
            <div class="data-row"><span>🌑 ولادة الهلال:</span> <span id="r2" class="value"></span></div>
            <div class="data-row" style="background: rgba(59, 130, 246, 0.1);"><span>⏳ عمر الهلال:</span> <span id="r3" class="value"></span></div>
            <div class="data-row"><span>📐 الارتفاع:</span> <span id="r4" class="value"></span></div>
            <div class="data-row"><span>📏 البعد الزاوي:</span> <span id="r5" class="value"></span></div>
        </div>
    </div>

    <script>
        let attemptCount = 0;

        function tryCalculate() {
            attemptCount++;
            const status = document.getElementById('status');
            const res = document.getElementById('results');

            try {
                // إحداثيات ثابتة للبصرة لضمان استقرار التجربة
                const observer = new Astronomy.Observer(30.5, 47.8, 0);
                const sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, 1, new Date(), 1);

                if (sunset && sunset.date) {
                    const sDate = sunset.date;
                    const mq = Astronomy.SearchMoonQuarter(sDate);
                    const nm = mq.prev.date;
                    const diff = sDate - nm;
                    
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const equ = Astronomy.Equator(Astronomy.Body.Moon, sDate, observer);
                    const hor = Astronomy.Horizon(sDate, observer, equ.ra, equ.dec, 'nora');
                    const elo = Astronomy.Elongation(Astronomy.Body.Moon, sDate);

                    document.getElementById('r1').innerText = sDate.toLocaleTimeString('ar-EG');
                    document.getElementById('r2').innerText = nm.toLocaleTimeString('ar-EG');
                    document.getElementById('r3').innerText = h + " ساعة و " + m + " دقيقة";
                    document.getElementById('r4').innerText = hor.alt.toFixed(2) + "°";
                    document.getElementById('r5').innerText = elo.angsep.toFixed(2) + "°";

                    status.className = "status-msg success";
                    status.innerText = "تم استلام البيانات بنجاح ✅";
                    res.style.display = 'block';
                    console.log("نجح الحساب في المحاولة رقم: " + attemptCount);
                } else {
                    status.innerText = "محاولة رقم " + attemptCount + ": في انتظار استجابة المحرك...";
                    setTimeout(tryCalculate, 1000); // إعادة المحاولة بعد ثانية
                }
            } catch (e) {
                status.innerText = "جاري إعادة التوصيل... (" + attemptCount + ")";
                setTimeout(tryCalculate, 1500);
            }
        }

        // بدء المحاولة الأولى فور التحميل
        window.onload = tryCalculate;
    </script>
</body>
</html>
