<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حساب الهلال - النسخة النهائية</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1a1f2b; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 2px solid #4361ee; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #242c3d; color: white; font-size: 16px; box-sizing: border-box; }
        button { background: #4361ee; font-weight: bold; cursor: pointer; border: none; }
        .result-box { margin-top: 20px; text-align: right; background: #0b0e14; padding: 15px; border-radius: 15px; display: none; border-right: 5px solid #4cc9f0; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a1f2b; }
        .val { color: #ffeb3b; font-weight: bold; }
        #error-log { color: #ff4d4d; font-size: 13px; margin-top: 10px; display: none; padding: 10px; background: rgba(255,0,0,0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color: #4cc9f0;">🌙 حساب الهلال المباشر</h2>
        
        <div style="text-align: right; margin-bottom: 5px;">وقت الرصد اليدوي:</div>
        <input type="datetime-local" id="u-date">

        <div style="display:flex; gap:10px;">
            <div style="flex:1"> عرض: <input type="number" id="lat" value="30.5" step="any"> </div>
            <div style="flex:1"> طول: <input type="number" id="lon" value="47.8" step="any"> </div>
        </div>
        
        <button onclick="runCalculation()">احسب البيانات المدخلة</button>
        <div id="error-log"></div>

        <div id="res" class="result-box">
            <div class="row"><span>📅 الوقت المعتمد:</span> <span id="v1" class="val"></span></div>
            <div class="row"><span>🌑 ولادة الهلال (النيومون):</span> <span id="v2" class="val"></span></div>
            <div class="row" style="background: rgba(67, 97, 238, 0.1);"><span>⏳ عمر الهلال:</span> <span id="v3" class="val" style="color:#4cc9f0"></span></div>
            <div class="row"><span>📐 الارتفاع:</span> <span id="v4" class="val"></span></div>
            <div class="row"><span>📏 البعد الزاوي:</span> <span id="v5" class="val"></span></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            let d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            document.getElementById('u-date').value = d.toISOString().slice(0, 16);
        };

        function runCalculation() {
            const err = document.getElementById('error-log');
            const res = document.getElementById('res');
            err.style.display = 'none';

            try {
                const observer = new Astronomy.Observer(
                    parseFloat(document.getElementById('lat').value),
                    parseFloat(document.getElementById('lon').value),
                    0
                );
                
                const targetDate = new Date(document.getElementById('u-date').value);
                if (isNaN(targetDate)) throw "يرجى إدخال تاريخ صحيح";

                // تصحيح الخطأ: نمرر 'true' أو 'false' كقيمة Boolean صريحة
                const equ = Astronomy.Equator(Astronomy.Body.Moon, targetDate, observer);
                const hor = Astronomy.Horizon(targetDate, observer, equ.ra, equ.dec, true); 
                const elo = Astronomy.Elongation(Astronomy.Body.Moon, targetDate);

                // حساب المحاق السابق (نيومون)
                let searchDate = new Date(targetDate.getTime() - (30 * 24 * 60 * 60 * 1000));
                let mq = Astronomy.SearchMoonQuarter(searchDate);
                
                // التأكد من الحصول على التاريخ الصحيح للمحاق
                let nmDate = mq.date;
                const ageDiff = targetDate - nmDate;
                const h = Math.floor(ageDiff / 3600000);
                const m = Math.floor((ageDiff % 3600000) / 60000);

                document.getElementById('v1').innerText = targetDate.toLocaleString('ar-EG');
                document.getElementById('v2').innerText = nmDate.toLocaleString('ar-EG');
                document.getElementById('v3').innerText = h + " ساعة و " + m + " دقيقة";
                document.getElementById('v4').innerText = hor.alt.toFixed(2) + "°";
                document.getElementById('v5').innerText = elo.angsep.toFixed(2) + "°";

                res.style.display = 'block';
            } catch (e) {
                err.innerText = "فشل الحساب: " + e.message;
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
