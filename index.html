<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حساب الهلال - العودة للأساسيات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 600px; border: 2px solid #38bdf8; }
        .row { display: grid; grid-template-columns: 1fr 1fr 100px; gap: 10px; margin-bottom: 10px; }
        input { padding: 10px; border-radius: 4px; border: 1px solid #38bdf8; background: #0f172a; color: #38bdf8; text-align: center; }
        .btn { padding: 10px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; background: #38bdf8; color: #0f172a; }
        #results-area { border: 1px solid #334155; padding: 15px; border-radius: 5px; background: #111827; margin-top: 15px; text-align: center; color: #94a3b8; }
    </style>
</head>
<body>
<div class="card">
    <h2 style="text-align:center">🌙 بيانات رؤية الهلال (النسخة الأساسية)</h2>
    <div class="row">
        <input type="text" id="dateInput" placeholder="التاريخ">
        <input type="text" id="timeInput" placeholder="الوقت">
        <button class="btn" onclick="setNow()">الآن 🕒</button>
    </div>
    <button class="btn" style="width:100%" onclick="calculate()">حساب البيانات</button>
    <div id="results-area">النتائج ستظهر هنا...</div>
</div>

<script>
    const datePicker = flatpickr("#dateInput", { dateFormat: "F / Y / d" });
    const timePicker = flatpickr("#timeInput", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });

    function setNow() {
        const now = new Date();
        datePicker.setDate(now);
        timePicker.setDate(now);
    }

    function calculate() {
        // العودة للمنطق الأساسي الذي كان يعمل
        const d = datePicker.selectedDates[0];
        if(!d) return;
        
        // هنا سنضع المنطق الذي أثبت استقراره فقط دون تعديلات إضافية
        document.getElementById('results-area').innerHTML = "تمت استعادة الإعدادات الأساسية. سنعيد ربط الحسابات الموثوقة خطوة بخطوة في المرة القادمة.";
    }
</script>
</body>
</html>
