<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال الاحترافي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 500px; border: 2px solid #38bdf8; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; }
        .btn-main { background: #38bdf8; color: #0f172a; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .result-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; }
        .status-ok { color: #2ecc71; }
        .status-bad { color: #e74c3c; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center;">🌙 بيانات رؤية الهلال</h2>
    
    <label>التاريخ والوقت:</label>
    <input type="datetime-local" id="dateInput" onchange="autoUpdate()">
    
    <div class="grid">
        <div><label>المحافظة:</label><select id="citySelect" onchange="selectCity()"><option value="">-- اختر --</option></select></div>
        <div><label>موعد الاقتران القادم:</label><div id="conjunctionResult" style="padding:10px; background:#1e293b; color:#fbbf24;">--</div></div>
    </div>

    <div class="grid">
        <div><label>خط العرض (Lat):</label><input type="number" id="lat" step="any" oninput="clearCity()"></div>
        <div><label>خط الطول (Lon):</label><input type="number" id="lon" step="any" oninput="clearCity()"></div>
    </div>

    <button class="btn-main" onclick="showResults()">إظهار النتيجة</button>

    <div id="resultsArea" class="result-box" style="display:none;">
        </div>
</div>

<script>
    const iraqCities = [
        { name: "البصرة", lat: 30.5081, lon: 47.7835 }, { name: "بغداد", lat: 33.3152, lon: 44.3661 },
        { name: "كربلاء", lat: 32.6164, lon: 44.0246 }, { name: "السليمانية", lat: 35.5558, lon: 45.4350 }
        // ... (يمكنك تكملة الـ 18 محافظة بنفس النمط)
    ];

    // تعبئة القائمة
    const citySelect = document.getElementById('citySelect');
    iraqCities.forEach(c => citySelect.innerHTML += `<option value='${JSON.stringify(c)}'>${c.name}</option>`);

    function autoUpdate() {
        let date = new Date(document.getElementById('dateInput').value);
        // البحث عن الاقتران تلقائياً
        let conj = findNextConjunction(date);
        document.getElementById('conjunctionResult').innerText = conj ? conj.toLocaleString('ar-IQ', {dateStyle:'short', timeStyle:'short'}) : "غير متاح";
    }

    function findNextConjunction(start) {
        let d = new Date(start);
        for (let i = 0; i < 720; i++) { // بحث لـ 30 يوم
            d.setHours(d.getHours() + 1);
            let moon = SunCalc.getMoonPosition(d, 0, 0);
            let sun = SunCalc.getPosition(d, 0, 0);
            if (Math.abs(moon.azimuth - sun.azimuth) < 0.05) return d;
        }
        return null;
    }

    function selectCity() {
        let city = JSON.parse(citySelect.value);
        document.getElementById('lat').value = city.lat;
        document.getElementById('lon').value = city.lon;
    }

    function clearCity() { citySelect.value = ""; }

    function showResults() {
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('resultsArea').innerHTML = `
            <p>النتائج ستظهر هنا مع المقارنة اللونية...</p>
        `;
        // هنا سنقوم لاحقاً بإضافة منطق المقارنة مع الحدود الآمنة
    }
</script>
</body>
</html>
