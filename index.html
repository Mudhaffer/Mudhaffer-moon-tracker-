<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مرصد الهلال الاحترافي</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .card { background: #1a1f2b; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 1px solid #3f51b5; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #2d3748; background: #0b0e14; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #3f51b5; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .res-container { margin-top: 20px; background: #0b0e14; border-radius: 15px; display: none; overflow: hidden; }
        .res-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #1a1f2b; }
        .label { color: #a0aec0; }
        .value { color: #facc15; font-weight: bold; font-family: monospace; font-size: 17px; }
        .highlight { background: rgba(63, 81, 181, 0.2); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color: #4cc9f0;">🌙 بيانات الهلال الدقيقة</h2>
    
    <label>وقت الرصد المستهدف:</label>
    <input type="datetime-local" id="userTime">

    <div style="display:flex; gap:10px;">
        <input type="number" id="lat" value="30.5" step="any">
        <input type="number" id="lon" value="47.8" step="any">
    </div>

    <button onclick="calculatePrecision()">توليد البيانات الفلكية</button>

    <div id="resultBox" class="res-container">
        <div class="res-row"><span class="label">🌑 ولادة القمر (المحاق):</span> <span id="birth" class="value"></span></div>
        <div class="res-row highlight"><span class="label">⏳ عمر الهلال الآن:</span> <span id="age" class="value"></span></div>
        <div class="res-row"><span class="label">📐 ارتفاع القمر عن الأفق:</span> <span id="alt" class="value"></span></div>
        <div class="res-row"><span class="label">📏 البعد الزاوي (الاستطالة):</span> <span id="elo" class="value"></span></div>
    </div>
</div>

<script>
    // تعيين الوقت الحالي عند الفتح
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('userTime').value = now.toISOString().slice(0, 16);

    function calculatePrecision() {
        try {
            const time = new Date(document.getElementById('userTime').value);
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            const obs = new Astronomy.Observer(lat, lon, 0);

            // 1. حساب ولادة القمر (المحاق السابق لهذا التاريخ بدقة)
            // نستخدم SearchMoonQuarter للبحث عن القمر الجديد (0)
            let searchDate = new Date(time.getTime());
            let mq = Astronomy.SearchMoonQuarter(searchDate);
            
            // إذا كان المحاق المكتشف بعد وقت الرصد، نبحث عن المحاق الذي قبله
            if (mq.date > time) {
                mq = Astronomy.SearchMoonQuarter(new Date(mq.date.getTime() - 10 * 86400000));
            }
            
            const birthDate = mq.date;

            // 2. حساب الارتفاع الحقيقي (Topocentric Altitude)
            const equ = Astronomy.Equator(Astronomy.Body.Moon, time, obs, true, true);
            const hor = Astronomy.Horizon(time, obs, equ.ra, equ.dec, 'none');

            // 3. حساب الاستطالة (البعد الزاوي)
            const elo = Astronomy.Elongation(Astronomy.Body.Moon, time);

            // 4. معالجة عمر الهلال
            const diffMs = time - birthDate;
            const hours = Math.floor(diffMs / 3600000);
            const mins = Math.floor((diffMs % 3600000) / 60000);

            // 5. العرض في الجدول
            document.getElementById('birth').innerText = birthDate.toLocaleString('ar-EG', {hour12: true});
            document.getElementById('age').innerText = hours + " ساعة و " + mins + " دقيقة";
            document.getElementById('alt').innerText = (hor.alt).toFixed(2) + "°";
            document.getElementById('elo').innerText = (elo.angsep).toFixed(2) + "°";

            document.getElementById('resultBox').style.display = 'block';

        } catch (err) {
            alert("حدث خطأ في الحساب: " + err.message);
        }
    }
</script>

</body>
</html>
