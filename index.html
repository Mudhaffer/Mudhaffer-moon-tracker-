<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المحرك العالمي للهلال - إصدار #48</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { background: #05070a; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; background: #0f172a; border: 1px solid #1e293b; border-radius: 15px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; border-bottom: 2px solid #334155; margin-bottom: 20px; padding-bottom: 10px; }
        .ver-tag { color: #38bdf8; font-size: 12px; font-weight: bold; }
        .data-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .data-item { background: #1e293b; padding: 15px; border-radius: 10px; border-right: 4px solid #38bdf8; }
        .label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .value { display: block; font-size: 18px; font-weight: bold; color: #f1f5f9; font-family: monospace; }
        .btn-update { width: 100%; padding: 15px; margin-top: 20px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-update:hover { background: #0ea5e9; }
        .error-log { color: #f87171; font-size: 11px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:#38bdf8;">🌙 المحرك المرجعي</h2>
        <span class="ver-tag">النسخة الاحترافية الكاملة - محاولة #48</span>
    </div>

    <div class="data-grid">
        <div class="data-item">
            <span class="label">توقيت الرصد (محلي):</span>
            <span id="obs-time" class="value">--:--</span>
        </div>
        <div class="data-item">
            <span class="label">لحظة الاقتران / ولادة القمر (UTC):</span>
            <span id="birth-time" class="value">جاري الحساب...</span>
        </div>
        <div class="data-item" style="border-right-color: #fbbf24;">
            <span class="label">عمر الهلال الفعلي:</span>
            <span id="moon-age" class="value">--</span>
        </div>
        <div class="data-item">
            <span class="label">ارتفاع القمر عن الأفق:</span>
            <span id="moon-alt" class="value">0.00°</span>
        </div>
        <div class="data-item">
            <span class="label">البعد الزاوي (الاستطالة):</span>
            <span id="moon-elo" class="value">0.00°</span>
        </div>
    </div>

    <button class="btn-update" onclick="initEngine()">تحديث البيانات الفورية</button>
    <div id="log" class="error-log"></div>
</div>

<script>
    // المحرك الأساسي المستوحى من تطبيق Moon-Calc العالمي
    function initEngine() {
        const log = document.getElementById('log');
        try {
            // 1. تحديد الوقت والإحداثيات (البصرة كمثال مرجعي)
            const now = new Date();
            document.getElementById('obs-time').innerText = now.toLocaleString('ar-EG');
            
            const lat = 30.5;
            const lon = 47.8;
            const observer = new Astronomy.Observer(lat, lon, 0);

            // 2. البحث عن أقرب محاق (New Moon) - معالجة خطأ الـ 700 ساعة
            let searchDate = new Date(now.getTime());
            let mq = Astronomy.SearchMoonQuarter(searchDate);
            
            // إذا كان الربع المكتشف ليس محاقاً أو في المستقبل، نعود للخلف
            if (mq.quarter !== 0 || mq.date > now) {
                mq = Astronomy.SearchMoonQuarter(new Date(mq.date.getTime() - 20 * 86400000));
            }

            // 3. الحسابات الفيزيائية للقمر
            const equ = Astronomy.Equator(Astronomy.Body.Moon, now, observer, true, true);
            const hor = Astronomy.Horizon(now, observer, equ.ra, equ.dec, 'none');
            const elo = Astronomy.Elongation(Astronomy.Body.Moon, now);

            // 4. معالجة الفوارق الزمنية
            const diffMs = now - mq.date;
            const hrs = Math.floor(diffMs / (1000 * 60 * 60));
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            // 5. عرض النتائج النهائية بدقة المراصد
            document.getElementById('birth-time').innerText = mq.date.toUTCString();
            document.getElementById('moon-age').innerText = `${hrs} ساعة و ${mins} دقيقة`;
            document.getElementById('moon-alt').innerText = (hor.alt || 0).toFixed(4) + "°";
            document.getElementById('moon-elo').innerText = (elo.angsep || 0).toFixed(4) + "°";
            
            log.innerText = "تم تحديث المحرك بنجاح (Ver 48)";
            log.style.color = "#4ade80";

        } catch (e) {
            log.innerText = "فشل المحرك: " + e.message;
            log.style.color = "#f87171";
        }
    }

    // التشغيل التلقائي عند فتح الصفحة لضمان عدم وجود قيم undefined
    window.onload = initEngine;
</script>

</body>
</html>
