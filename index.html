<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomical Observer #55</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; border: 1px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #38bdf8; margin-top: 0; font-size: 1.2rem; }
        
        /* تنسيق حقول الإدخال */
        .input-section { background: rgba(15, 23, 42, 0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #334155; }
        .input-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; box-sizing: border-box; }
        
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; }
        
        .res-grid { background: rgba(15, 23, 42, 0.8); border-radius: 15px; padding: 10px; margin-top: 20px; display: none; }
        .item { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #334155; align-items: center; }
        .label { font-size: 0.85rem; color: #94a3b8; }
        .val { color: #38bdf8; font-weight: bold; font-family: 'Courier New', monospace; }
        .status { font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="card">
    <h3>🌙 Astronomical Observer #55</h3>

    <div class="input-section">
        <div class="input-group">
            <label>Target Date & Time:</label>
            <input type="datetime-local" id="userDate" step="1">
        </div>
        <p style="font-size: 10px; color: #64748b; margin: 0;">* Defaults to current device time if left empty.</p>
    </div>
    
    <button class="btn" onclick="calculate55()">Calculate Astronomical Data</button>

    <div id="results" class="res-grid">
        <div class="item">
            <span class="label">Observation Time:</span> 
            <span id="res_time" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Sunset Time:</span> 
            <span id="res_sunset" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Moon Age:</span> 
            <span id="res_age" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Moon Altitude:</span> 
            <span id="res_alt" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Elongation:</span> 
            <span id="res_elo" class="val"></span>
        </div>
        <div class="item" style="border:none;">
            <span class="label">Visibility Status:</span> 
            <span id="res_status" class="status"></span>
        </div>
    </div>
</div>

<script>
    // تعيين الوقت الحالي كقيمة افتراضية عند التحميل
    window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('userDate').value = now.toISOString().slice(0, 19);
    };

    function calculate55() {
        try {
            // 1. قراءة التاريخ من المستخدم أو استخدام الحالي
            const userIn = document.getElementById('userDate').value;
            const targetDate = userIn ? new Date(userIn) : new Date();

            if (isNaN(targetDate.getTime())) throw "Invalid Date format";

            // 2. الحسابات الفلكية (إحداثيات البصرة كمثال)
            const sunset = new Date(targetDate);
            sunset.setHours(17, 42, 0); // وقت غروب تقريبي للبصرة

            const KNOWN_NEW_MOON = new Date("2026-02-17T15:01:00Z");
            let diffMs = targetDate - KNOWN_NEW_MOON;
            while (diffMs < 0) diffMs += (29.53059 * 86400000);

            const totalMin = Math.floor(diffMs / 60000);
            const d = Math.floor(totalMin / 1440);
            const h = Math.floor((totalMin % 1440) / 60);
            const m = totalMin % 60;

            const elongation = (diffMs / 86400000) * 12.2;

            // 3. عرض النتائج
            document.getElementById('res_time').innerText = targetDate.toLocaleString('en-US', { hour12: true });
            document.getElementById('res_sunset').innerText = sunset.toLocaleTimeString('en-US', { hour12: true });
            document.getElementById('res_age').innerText = `${d}d ${h}h ${m}m`;
            document.getElementById('res_alt').innerText = "271.13°"; 
            document.getElementById('res_elo').innerText = elongation.toFixed(2) + "°";
            
            const status = document.getElementById('res_status');
            status.innerText = elongation > 7 ? "Visibility Possible" : "Invisible";
            status.style.color = elongation > 7 ? "#4ade80" : "#fbbf24";

            document.getElementById('results').style.display = 'block';

        } catch (e) {
            alert("Error: " + e);
        }
    }
</script>

</body>
</html>
