<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; width: 100%; max-width: 600px; border: 2px solid #38bdf8; }
        h2 { text-align: center; color: #f1f5f9; margin-top: 0; }
        
        .row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #38bdf8; background: #0f172a; color: #38bdf8; text-align: center; }
        .btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-now { background: #22c55e; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }

        /* --- تنسيق أيقونات التقويم والوقت الجديدة --- */
        
        /* 1. إزالة الأيقونات الافتراضية الداكنة */
        .flatpickr-input {
            background-image: none !important;
        }

        /* 2. إضافة أيقونة التقويم الزرقاء لحقل التاريخ */
        #dateInput {
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3C/svg%3E") !important;
            background-repeat: no-repeat !important;
            background-position: left 10px center !important;
            background-size: 20px !important;
            padding-left: 40px; /* مساحة للأيقونة جهة اليسار */
        }

        /* 3. إضافة أيقونة الساعة الزرقاء لحقل الوقت */
        #timeInput {
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='10'%3E%3C/circle%3E%3Cpolyline points='12 6 12 12 16 14'%3E%3C/polyline%3E%3C/svg%3E") !important;
            background-repeat: no-repeat !important;
            background-position: left 10px center !important;
            background-size: 20px !important;
            padding-left: 40px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 بيانات رؤية الهلال</h2>
    
    <div class="row">
        <input type="text" id="dateInput" placeholder="التاريخ (DD/Month/YYYY)">
        <input type="text" id="timeInput" placeholder="الوقت (24h)">
        <button class="btn-now" onclick="setNow()">الآن 🕒</button>
    </div>

    <div class="input-group">
        <button class="btn-action" onclick="getLocation()">تلقائي 📍</button>
        <select id="citySelect"><option>البصرة</option></select>
        <input type="text" id="lat" placeholder="Lat">
        <input type="text" id="lon" placeholder="Lon">
    </div>

    <div class="input-group">
        <button class="btn-action" onclick="calculate()">إظهار النتيجة</button>
        <input type="text" id="moonData" placeholder="بيانات الهلال" disabled>
        <input type="text" id="conjunction" placeholder="موعد الاقتران" disabled>
    </div>

    <div id="results" style="border: 1px solid #334155; padding: 15px; border-radius: 5px; text-align: center; color: #94a3b8;">
        النتائج ستظهر هنا عند الضغط على إظهار النتيجة...
    </div>
</div>

<script>
    // تهيئة مكتبة Flatpickr وحفظ النسخ في متغيرات
    const datePicker = flatpickr("#dateInput", { 
        dateFormat: "d / F / Y" 
    });
    
    const timePicker = flatpickr("#timeInput", { 
        enableTime: true, 
        noCalendar: true, 
        dateFormat: "H:i", 
        time_24hr: true 
    });

    function setNow() {
        const now = new Date();
        datePicker.setDate(now);
        timePicker.setDate(now);
    }
       
    function calculate() {
        document.getElementById('results').innerHTML = "جاري معالجة البيانات الفلكية...";
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById('lat').value = position.coords.latitude.toFixed(4);
                document.getElementById('lon').value = position.coords.longitude.toFixed(4);
            });
        } else {
            alert("المتصفح لا يدعم تحديد الموقع.");
        }
    }
</script>
</body>
</html>
