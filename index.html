<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرصد الهلال - إدخال يدوي</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #0b0e14; color: white; text-align: center; padding: 20px; }
        .card { background: #1a1f2b; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #4361ee; color: white; border: none; padding: 12px; width: 85%; border-radius: 10px; cursor: pointer; }
        .result-box { margin-top: 20px; text-align: right; background: #242c3d; padding: 15px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h3>مرصد الهلال (إدخال يدوي)</h3>
        <input type="number" id="lat" placeholder="خط العرض (مثلاً 30.5)" step="any">
        <input type="number" id="lon" placeholder="خط الطول (مثلاً 47.8)" step="any">
        <button onclick="calculateManual()">حساب البيانات الآن</button>

        <div id="results" class="result-box">
            <p>وقت الغروب: <span id="v-sunset"></span></p>
            <p>عمر القمر: <span id="v-age"></span></p>
            <p>الارتفاع: <span id="v-alt"></span></p>
            <p>البعد الزاوي: <span id="v-elong"></span></p>
        </div>
    </div>

    <script>
        function calculateManual() {
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            
            if(!lat || !lon) { alert("يرجى إدخال الإحداثيات"); return; }

            const observer = new Astronomy.Observer(lat, lon, 0);
            const sunset = Astronomy.SearchRiseSet(Astronomy.Body.Sun, observer, Astronomy.Direction.Set, new Date());
            const prevNewMoon = Astronomy.SearchMoonQuarter(sunset.date).prev;
            
            const diffMs = sunset.date.getTime() - prevNewMoon.date.getTime();
            const hours = Math.floor(diffMs / (1000 * 60 * 60));
            const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            const moonEquator = Astronomy.Equator(Astronomy.Body.Moon, sunset.date, observer);
            const moonHoriz = Astronomy.Horizon(sunset.date, observer, moonEquator.ra, moonEquator.dec, 'nora');
            const elongation = Astronomy.Elongation(Astronomy.Body.Moon, sunset.date);

            document.getElementById('results').style.display = 'block';
            document.getElementById('v-sunset').innerText = sunset.date.toLocaleTimeString('ar-EG');
            document.getElementById('v-age').innerText = hours + " ساعة و " + minutes + " دقيقة";
            document.getElementById('v-alt').innerText = moonHoriz.alt.toFixed(2) + "°";
            document.getElementById('v-elong').innerText = elongation.angsep.toFixed(2) + "°";
        }
    </script>
</body>
</html>
