<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حساب بيانات الهلال</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.18/astronomy.js"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 480px; border: 1px solid #38bdf8; }
        .header { text-align: center; border-bottom: 1px solid #334155; margin-bottom: 20px; padding-bottom: 10px; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-geo { background: #2ecc71; margin-bottom: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🌙 حساب بيانات الهلال</h2>
    </div>

    <button type="button" class="btn btn-geo" onclick="getUserLocation()">📍 تحديد موقعي تلقائياً</button>

    <div class="grid-3">
        <input type="number" id="lat" placeholder="خط العرض (Latitude)" step="any">
        <input type="number" id="lon" placeholder="خط الطول (Longitude)" step="any">
    </div>

    <button type="button" class="btn" onclick="calculate()">عرض النتائج الآن</button>
</div>

<script>
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('lat').value = position.coords.latitude.toFixed(6);
                    document.getElementById('lon').value = position.coords.longitude.toFixed(6);
                    alert("تم تحديد موقعك بنجاح!");
                },
                () => { alert("تعذر الحصول على الموقع، يرجى تفعيل الصلاحية."); }
            );
        } else {
            alert("المتصفح لا يدعم تحديد الموقع.");
        }
    }

    function calculate() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lon = parseFloat(document.getElementById('lon').value);
    const now = new Date();

    // حساب موقع القمر والشمس باستخدام المكتبة
    const observer = new Astronomy.Observer(lat, lon, 0);
    const moon = Astronomy.MoonPosition(now);
    const sun = Astronomy.SunPosition(now);

    // عرض النتائج (تحتاج لإضافة div في HTML باسم resultDisplay لعرض البيانات)
    const resultDiv = document.getElementById('resultDisplay');
    resultDiv.innerHTML = `
        <p>ارتفاع القمر: ${moon.alt.toFixed(2)}°</p>
        <p>الاستطالة (زاوية الشمس والقمر): ${Astronomy.AngleFromSun(now, 'Moon').toFixed(2)}°</p>
    `;
}
</script>

</body>
</html>
