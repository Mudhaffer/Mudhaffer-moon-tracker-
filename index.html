<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 10px; padding: 20px; width: 100%; max-width: 600px; border: 2px solid #38bdf8; }
        h2 { text-align: center; color: #f1f5f9; margin-top: 0; }
        
        /* تنسيق الخانات لتكون متناسقة وصغيرة كما طلبت */
        .header-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .result-group { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 5px; margin-bottom: 15px; }
        
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #38bdf8; background: #0f172a; color: #38bdf8; text-align: center; width: 100%; box-sizing: border-box; }
        .btn-action { background: #38bdf8; color: #0f172a; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-now { background: #22c55e; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
        
        #results { border: 1px solid #334155; padding: 15px; border-radius: 5px; min-height: 80px; text-align: center; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 بيانات رؤية الهلال</h2>
    
    <div class="header-row">
        <input type="text" id="day" placeholder="اليوم">
        <input type="text" id="month" placeholder="الشهر">
        <input type="text" id="year" placeholder="السنة">
        <input type="text" id="time" placeholder="الوقت">
        <button class="btn-now" onclick="setNow()">الآن 🕒</button>
    </div>

    <div class="input-group">
        <button class="btn-action" onclick="getLocation()">تلقائي 📍</button>
        <select id="citySelect"><option>البصرة</option></select>
        <input type="text" id="lat" placeholder="Lat">
        <input type="text" id="lon" placeholder="Lon">
    </div>

    <div class="result-group">
        <button class="btn-action" onclick="calculate()">إظهار النتيجة</button>
        <input type="text" id="moonData" placeholder="بيانات الهلال" disabled>
        <input type="text" id="conjunction" placeholder="موعد الاقتران" disabled>
    </div>

    <div id="results">النتائج ستظهر هنا عند الضغط على إظهار النتيجة...</div>
</div>

<script>
    function setNow() {
        const now = new Date();
        document.getElementById('day').value = now.getDate();
        document.getElementById('month').value = now.toLocaleString('en-US', { month: 'long' });
        document.getElementById('year').value = now.getFullYear();
        document.getElementById('time').value = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
    }
</script>
</body>
</html>
