<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حساب بيانات الهلال</title>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.18/astronomy.browser.min.js"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 480px; border: 1px solid #38bdf8; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-geo { background: #2ecc71; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; }
        #resultDisplay { margin-top: 20px; padding: 15px; background: #0f172a; border: 1px solid #334155; text-align: center; border-radius: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 حساب بيانات الهلال</h2>
    <button class="btn btn-geo" onclick="getUserLocation()">📍 تحديد موقعي تلقائياً</button>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="number" id="lat" placeholder="خط العرض">
        <input type="number" id="lon" placeholder="خط الطول">
    </div>
    <button class="btn" onclick="calculate()">عرض النتائج الآن</button>
    <div id="resultDisplay">النتائج ستظهر هنا...</div>
</div>

<script>
    function getUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude.toFixed(4);
                document.getElementById('lon').value = pos.coords.longitude.toFixed(4);
            });
        }
    }

  function calculate() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lon = parseFloat(document.getElementById('lon').value);
    const now = new Date();

    if (isNaN(lat) || isNaN(lon)) {
        alert("يرجى تحديد الموقع أولاً!");
        return;
    }

    try {
        // 1. إنشاء كائن المراقب بشكل صحيح حسب متطلبات المكتبة
        const observer = new Astronomy.Observer(lat, lon, 0);

        // 2. حساب موقع القمر والشمس باستخدام كائن المراقب
        // ملاحظة: تأكد من دقة الدوال بناءً على إصدار المكتبة
        const moonPos = Astronomy.MoonPosition(now);
        const sunPos = Astronomy.SunPosition(now);
        
        // 3. حساب الإحداثيات الأفقية (الارتفاع) بناءً على الموقع
        const hor = Astronomy.Horizon(now, observer.latitude, observer.longitude, 0, moonPos.ra, moonPos.dec);
        
        // 4. حساب الاستطالة (الزاوية بين الشمس والقمر)
        const elongation = Astronomy.AngleBetween(sunPos.ra, sunPos.dec, moonPos.ra, moonPos.dec);

        // 5. عرض النتائج
        const resultDiv = document.getElementById('resultDisplay');
        if (resultDiv) {
            resultDiv.innerHTML = `
                <p>ارتفاع القمر: ${hor.altitude.toFixed(2)}°</p>
                <p>الاستطالة: ${elongation.toFixed(2)}°</p>
            `;
        }
    } catch (e) {
        console.error(e);
        document.getElementById('resultDisplay').innerHTML = "خطأ في الحساب: " + e.message;
    }
}
</script>
</body>
</html>
