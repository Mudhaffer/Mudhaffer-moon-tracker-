<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بيانات رؤية الهلال</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        body { background: #f8fafc; color: #1e293b; font-family: sans-serif; padding: 20px; }
        .app-container { border: 3px solid #1e40af; border-radius: 20px; padding: 25px; max-width: 500px; margin: auto; background: white; }
        h2 { text-align: center; color: #1e40af; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; }
        input, select { width: 100%; padding: 10px; border: 2px solid #1e40af; border-radius: 8px; }
        .btn-main { background: #dc2626; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; font-weight: bold; }
        .result-panel { border: 2px solid #065f46; border-radius: 10px; padding: 15px; margin-top: 20px; }
        .status-ok { color: green; }
        .status-bad { color: red; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>🌙 بيانات رؤية الهلال</h2>
    
    <label>التاريخ والوقت:</label>
    <input type="datetime-local" id="dateInput">

    <div class="row">
        <div class="field">
            <label>المحافظة:</label>
            <select id="citySelect"><option>البصرة</option></select>
        </div>
        <div class="field">
            <label>موعد الاقتران القادم:</label>
            <input type="text" id="conjunction" disabled>
        </div>
    </div>

    <div class="row">
        <div class="field"><label>Lat:</label><input type="text" id="lat"></div>
        <div class="field"><label>Lon:</label><input type="text" id="lon"></div>
    </div>

    <button class="btn-main" onclick="calculate()">إظهار النتيجة</button>

    <div id="results" class="result-panel">
        </div>
</div>

<script>
    function calculate() {
        // سيتم دمج منطق الحساب الفلكي هنا
        document.getElementById('results').innerHTML = "النتائج ستظهر هنا مع المقارنة اللونية...";
    }
</script>
</body>
</html>
