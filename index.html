<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق رؤية الهلال الاحترافي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 480px; border: 1px solid #38bdf8; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; margin-top: 5px; box-sizing: border-box; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🌙 مراكز محافظات العراق</h2>
    
    <label>اختر المحافظة:</label>
    <select id="citySelect" onchange="updateCoords()">
        <option value="">-- اختر المحافظة --</option>
    </select>
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <input type="number" id="lat" placeholder="خط العرض" step="any">
        <input type="number" id="lon" placeholder="خط الطول" step="any">
    </div>

    <button class="btn" onclick="calculate()">عرض النتائج</button>
    <div id="resultDisplay" style="margin-top: 20px;"></div>
</div>

<script>
    const iraqCities = [
        { name: "البصرة", lat: 30.5081, lon: 47.7835 }, { name: "بغداد", lat: 33.3152, lon: 44.3661 },
        { name: "الموصل", lat: 36.3400, lon: 43.1300 }, { name: "أربيل", lat: 36.1911, lon: 44.0092 },
        { name: "السليمانية", lat: 35.5558, lon: 45.4350 }, { name: "كركوك", lat: 35.4681, lon: 44.3922 },
        { name: "النجف", lat: 32.0292, lon: 44.3222 }, { name: "كربلاء", lat: 32.6164, lon: 44.0246 },
        { name: "الحلة", lat: 32.4828, lon: 44.4336 }, { name: "الديوانية", lat: 31.9833, lon: 44.9167 },
        { name: "العمارة", lat: 31.8419, lon: 47.1472 }, { name: "الناصرية", lat: 31.0593, lon: 46.2519 },
        { name: "الكوت", lat: 32.5033, lon: 45.8239 }, { name: "بعقوبة", lat: 33.7539, lon: 44.6469 },
        { name: "الرمادي", lat: 33.4245, lon: 43.2842 }, { name: "السماوة", lat: 31.3267, lon: 45.2933 },
        { name: "دهوك", lat: 36.8667, lon: 42.9833 }, { name: "تكريت", lat: 34.6075, lon: 43.6817 }
    ];

    // تعبئة القائمة عند تحميل الصفحة
    const select = document.getElementById('citySelect');
    iraqCities.forEach(city => {
        let opt = document.createElement('option');
        opt.value = JSON.stringify({lat: city.lat, lon: city.lon});
        opt.innerHTML = city.name;
        select.appendChild(opt);
    });

    function updateCoords() {
        const val = JSON.parse(select.value);
        if(val) {
            document.getElementById('lat').value = val.lat;
            document.getElementById('lon').value = val.lon;
        }
    }

    function calculate() {
        // هنا سنضيف لاحقاً المحرك الفلكي الخاص بالاقتران والغروب
        alert("تم اختيار الموقع بنجاح! جاهزون للمرحلة القادمة: حساب الاقتران والغروب.");
    }
</script>
</body>
</html>
