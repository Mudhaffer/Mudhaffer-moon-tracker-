<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basra Moon Tracker #59</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 420px; border: 1px solid #38bdf8; }
        h3 { text-align: center; color: #38bdf8; margin-top: 0; }
        .input-section { background: rgba(15, 23, 42, 0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px dashed #334155; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; box-sizing: border-box; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .res-grid { background: rgba(15, 23, 42, 0.8); border-radius: 15px; padding: 10px; margin-top: 20px; }
        .item { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #334155; align-items: center; }
        .label { font-size: 0.85rem; color: #94a3b8; }
        .val { color: #38bdf8; font-weight: bold; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>

<div class="card">
    <h3>🌙 Basra Moon Tracker #59</h3>

    <div class="input-section">
        <label style="display:block; font-size:0.8rem; color:#94a3b8; margin-bottom:5px;">Select Target Date & Time:</label>
        <input type="datetime-local" id="userDate" step="1">
    </div>
    
    <button class="btn" onclick="calculate59()">Calculate Data (#59)</button>

    <div id="results" class="res-grid" style="display:none;">
        <div class="item">
            <span class="label">Target Date:</span> 
            <span id="res_date" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Sunset Time:</span> 
            <span id="res_sunset" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Moon Age:</span> 
            <span id="res_age" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Moon Altitude:</span> 
            <span id="res_alt" class="val"></span>
        </div>
        <div class="item">
            <span class="label">Elongation:</span> 
            <span id="res_elo" class="val"></span>
        </div>
        <div class="item" style="border:none;">
            <span class="label">Visibility:</span> 
            <span id="res_status" style="font-weight:bold;"></span>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('userDate').value = now.toISOString().slice(0, 19);
    };

    function calculate59() {
        try {
            const userIn = document.getElementById('userDate').value;
            if (!userIn) return;
            const targetDate = new Date(userIn);

            // حسابات النسخة المستقرة #56
            const dayOfYear = Math.floor((targetDate - new Date(targetDate.getFullYear(), 0, 0)) / 86400000);
            const sunsetHour = 17.7 + (Math.sin((dayOfYear - 80) * 2 * Math.PI / 365) * 0.45); 
            const sunsetDate = new Date(targetDate);
            sunsetDate.setHours(Math.floor(sunsetHour), (sunsetHour % 1 * 60), 0);

            const KNOWN_NEW_MOON = new Date("2026-02-17T15:01:00Z");
            let diffMs = targetDate - KNOWN_NEW_MOON;
            const cycleMs = 29.53059 * 86400000;
            diffMs = ((diffMs % cycleMs) + cycleMs) % cycleMs;

            const d = Math.floor(diffMs / 86400000);
            const h = Math.floor((diffMs % 86400000) / 3600000);
            const m = Math.floor((diffMs % 3600000) / 60000);

            const elongation = (diffMs / 86400000) * 12.19;
            const timeFromSunset = (targetDate - sunsetDate) / 3600000;
            const altitude = 1.1 + (diffMs / 86400000 * 5) - (Math.abs(timeFromSunset) * 12);

            // التعديل المطلوب: اليوم ثم اسم الشهر ثم السنة
            const day = targetDate.getDate();
            const month = targetDate.toLocaleString('en-US', { month: 'long' });
            const year = targetDate.getFullYear();
            const timeStr = targetDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            
            document.getElementById('res_date').innerText = `${day} ${month} ${year}, ${timeStr}`;
            
            document.getElementById('res_sunset').innerText = sunsetDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            document.getElementById('res_age').innerText = `${d}d ${h}h ${m}m`;
            document.getElementById('res_alt').innerText = altitude.toFixed(2) + "°";
            document.getElementById('res_elo').innerText = elongation.toFixed(2) + "°";
            
            const status = document.getElementById('res_status');
            const isVisible = elongation > 8 && altitude > 0;
            status.innerText = isVisible ? "Visibility Possible" : "Not Visible";
            status.style.color = isVisible ? "#4ade80" : "#fbbf24";

            document.getElementById('results').style.display = 'block';
        } catch (e) { alert("Error: " + e.message); }
    }
</script>

</body>
</html>
