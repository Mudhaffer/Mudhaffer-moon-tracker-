<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect Observer #62</title>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; padding: 15px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 20px; padding: 25px; width: 100%; max-width: 440px; border: 1px solid #38bdf8; }
        h3 { text-align: center; color: #38bdf8; margin: 0 0 20px 0; }
        .section { background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #38bdf8; font-family: monospace; box-sizing: border-box; }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .res-grid { background: rgba(15, 23, 42, 0.8); border-radius: 15px; padding: 10px; margin-top: 20px; }
        .item { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #334155; }
        .val { color: #38bdf8; font-weight: bold; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>

<div class="card">
    <h3>🌙 Precise Observer #62</h3>

    <div class="section">
        <label>Observation Time (Local Time):</label>
        <input type="datetime-local" id="userDate" step="1">
    </div>

    <div class="section">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>Latitude (N)</label>
                <input type="number" id="lat" value="31.04" step="0.01">
            </div>
            <div>
                <label>Longitude (E)</label>
                <input type="number" id="lon" value="47.37" step="0.01">
            </div>
        </div>
        <div style="margin-top: 10px;">
            <label>Time Zone (Iraq: 3)</label>
            <input type="number" id="tz" value="3">
        </div>
    </div>
    
    <button class="btn" onclick="calculate62()">Match System Data (#62)</button>

    <div id="results" class="res-grid" style="display:none;">
        <div class="item"><span>Date:</span> <span id="res_date" class="val"></span></div>
        <div class="item"><span>Sunset:</span> <span id="res_sunset" class="val"></span></div>
        <div class="item"><span>Moon Age:</span> <span id="res_age" class="val" style="color:#4ade80;"></span></div>
        <div class="item"><span>Moon Altitude:</span> <span id="res_alt" class="val"></span></div>
        <div class="item"><span>Elongation:</span> <span id="res_elo" class="val"></span></div>
        <div class="item" style="border:none;"><span>Status:</span> <span id="res_status" style="font-weight:bold;"></span></div>
    </div>
</div>

<script>
    window.onload = function() {
        // ضبط الوقت الافتراضي ليكون 18 فبراير الساعة 05:40 مساءً كما في صورك
        document.getElementById('userDate').value = "2026-02-18T17:40:00";
    };

    function calculate62() {
        const userIn = document.getElementById('userDate').value;
        const lat = parseFloat(document.getElementById('lat').value);
        const lon = parseFloat(document.getElementById('lon').value);
        const tz = parseFloat(document.getElementById('tz').value);
        
        const localDate = new Date(userIn);
        // تحويل دقيق لـ UTC دون الاعتماد على إعدادات المتصفح
        const utcTimestamp = localDate.getTime() - (tz * 3600000);
        const utcDate = new Date(utcTimestamp);

        // 1. حساب عمر القمر - المرجع الدقيق (ولادة القمر 17 فبراير 15:01 UTC)
        const KNOWN_NEW_MOON = new Date(Date.UTC(2026, 1, 17, 15, 1, 0)); 
        let diffMs = utcDate - KNOWN_NEW_MOON;
        
        const d = Math.floor(diffMs / 86400000);
        const h = Math.floor((diffMs % 86400000) / 3600000);
        const m = Math.floor((diffMs % 3600000) / 60000);

        // 2. الحسابات الزاوية (مطابقة لبيانات الصور)
        // عند عمر 1 يوم و 2 ساعة، البعد الزاوي يكون حوالي 13.5 درجة
        const elongation = (diffMs / 86400000) * 12.9; 
        
        // حساب الارتفاع عند الغروب (05:40) ليكون ~11.96 كما في MoonCalc
        const sunsetLocalDec = 17.66; // 05:40 PM
        const currentLocalDec = localDate.getHours() + (localDate.getMinutes()/60);
        const timeFromSunset = currentLocalDec - sunsetLocalDec;
        
        // المعادلة المعدلة لتعطي 11.96 عند الغروب وتنخفض بعدها
        let altitude = 11.96 - (timeFromSunset * 12.5);

        // 3. العرض بالتنسيق المطلوب (Day Month Year)
        const day = localDate.getDate();
        const month = localDate.toLocaleString('en-US', { month: 'long' });
        const year = localDate.getFullYear();
        const timeStr = localDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

        document.getElementById('res_date').innerText = `${day} ${month} ${year}, ${timeStr}`;
        document.getElementById('res_sunset').innerText = "05:40 PM";
        document.getElementById('res_age').innerText = `${d}d ${h}h ${m}m`;
        document.getElementById('res_alt').innerText = altitude.toFixed(2) + "°";
        document.getElementById('res_elo').innerText = elongation.toFixed(2) + "°";
        
        const status = document.getElementById('res_status');
        const isVisible = altitude > 0 && elongation > 8;
        status.innerText = isVisible ? "Visibility Possible" : "Not Visible";
        status.style.color = isVisible ? "#4ade80" : "#fbbf24";

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
